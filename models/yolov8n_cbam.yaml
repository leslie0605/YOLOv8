# YOLOv8‑nano + CBAM
nc: 4 # ch, dc, hdc, sc

# YOLOv8 nano scale factor
scales:
  n: [0.33, 0.25, 1024] # depth, width, max_channels

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, CBAM, [64]] # 1: Attention
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 3, C2f, [128, True]] # 3
  - [-1, 1, CBAM, [128]] # 4: Attention
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 6, C2f, [256, True]] # 6
  - [-1, 1, CBAM, [256]] # 7: Attention
  - [-1, 1, Conv, [512, 3, 2]] # 8-P4/16
  - [-1, 6, C2f, [512, True]] # 9
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5]] # 12

head:
  # P5 (1024 -> 512)
  - [-1, 1, Conv, [512, 1, 1]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 9], 1, Concat, [1]] # 15: cat backbone P4
  - [-1, 3, C2f, [512]] # 16

  # P4 (512 -> 256)
  - [-1, 1, Conv, [256, 1, 1]] # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 7], 1, Concat, [1]] # 19: cat backbone P3
  - [-1, 3, C2f, [256]] # 20

  # P3 (256)
  - [-1, 1, Conv, [256, 1, 1]] # 21

  # P4 (256 -> 512)
  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 17], 1, Concat, [1]] # 23: cat head P4
  - [-1, 3, C2f, [512]] # 24

  # P5 (512 -> 1024)
  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 13], 1, Concat, [1]] # 26: cat head P5
  - [-1, 3, C2f, [1024]] # 27

  # Detect head
  - [[21, 24, 27], 1, Detect, [nc]] # Detect(P3, P4, P5)
